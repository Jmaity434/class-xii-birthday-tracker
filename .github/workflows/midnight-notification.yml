name: 🌙 Midnight Birthday Web Push Notification

on:
  schedule:
    # 18:30 UTC is exactly 00:00 (12:00 AM) Indian Standard Time (IST)
    - cron: '30 18 * * *'
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab anytime!

jobs:
  send-midnight-birthday-push:
    name: Check & Send Birthday Notifications
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: ⚙️ Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: 📦 Install Dependencies
        run: npm ci || npm install

      - name: 🚀 Run Midnight Push Sender
        env:
          VAPID_PUBLIC_KEY: ${{ secrets.VAPID_PUBLIC_KEY || 'BOikmHgA-OpCLC2tdLLJvaT93m2OMtqieOeOYlbExtjPocenhXbNpanbVUpwtqr42kWKIxHwRB8gobiI8VqxtGA' }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY || '2Nmu6tgEE2kK9lfx3hSErgtH0vzFdzq27XUN9V0tdFA' }}
          PUSH_SUBSCRIPTIONS: ${{ secrets.PUSH_SUBSCRIPTIONS }}
          SUBSCRIPTIONS_API_URL: ${{ secrets.SUBSCRIPTIONS_API_URL }}
          SUBSCRIPTIONS_API_KEY: ${{ secrets.SUBSCRIPTIONS_API_KEY }}
        run: node scripts/send-midnight-push.mjs
