name: 🌙 Midnight Birthday Web Push Notification

on:
  workflow_dispatch: # Manual trigger only (scheduled cron disabled to prevent automated failures & emails)

jobs:
  send-midnight-birthday-push:
    name: Check & Send Birthday Notifications
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: ⚙️ Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: 📦 Install Dependencies
        run: npm ci || npm install

      - name: 🚀 Run Midnight Push Sender
        env:
          VAPID_PUBLIC_KEY: ${{ secrets.VAPID_PUBLIC_KEY }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          PUSH_SUBSCRIPTIONS: ${{ secrets.PUSH_SUBSCRIPTIONS }}
          SUBSCRIPTIONS_API_URL: ${{ secrets.SUBSCRIPTIONS_API_URL }}
          SUBSCRIPTIONS_API_KEY: ${{ secrets.SUBSCRIPTIONS_API_KEY }}
        run: node scripts/send-midnight-push.mjs
